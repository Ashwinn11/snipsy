name: Postmark
options:
  bundleIdPrefix: com.ashwinn
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "PVQK77DQWL"
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Postmark:
    type: application
    platform: iOS
    sources:
      - path: Postmark
    dependencies:
      - target: PostmarkStickers
        embed: true
    entitlements:
      path: Postmark/Postmark.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ashwinn.postmark
    info:
      path: Postmark/Info.plist
      properties:
        CFBundleDisplayName: Postmark
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Postmark uses the camera so you can turn what you see into collectible stamps."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinn.postmark
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
  PostmarkStickers:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: PostmarkStickers
    entitlements:
      path: PostmarkStickers/PostmarkStickers.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ashwinn.postmark
    info:
      path: PostmarkStickers/Info.plist
      properties:
        CFBundleDisplayName: Postmark
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinn.postmark.stickers
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
