name: Snipsy
options:
  bundleIdPrefix: com.ashwinn
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "PVQK77DQWL"
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_REQUIRED: "NO"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    majorVersion: 5.0.0
targets:
  Snipsy:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Snipsy
    dependencies:
      - target: SnipsyStickers
        embed: true
      - target: SnipsyShare
        embed: true
      - package: RevenueCat
        product: RevenueCat
    entitlements:
      path: Snipsy/Snipsy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ashwinn.postmark
    info:
      path: Snipsy/Info.plist
      properties:
        CFBundleDisplayName: Snipsy
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Snipsy uses the camera so you can turn your moments into collectible stamps and stickers."
        NSPhotoLibraryAddUsageDescription: "Snipsy saves the stamps and stickers you export to your photo library."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinn.postmark
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.2"
  SnipsyStickers:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: SnipsyStickers
    entitlements:
      path: SnipsyStickers/SnipsyStickers.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ashwinn.postmark
    info:
      path: SnipsyStickers/Info.plist
      properties:
        CFBundleDisplayName: Snipsy
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Light
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinn.postmark.stickers
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.2"
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
  SnipsyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SnipsyShare
      - path: Snipsy/App/Theme.swift
      - path: Snipsy/Core/Models.swift
      - path: Snipsy/Core/CanvasModels.swift
      - path: Snipsy/Core/StampStore.swift
      - path: Snipsy/Core/VisionService.swift
      - path: Snipsy/Core/StampRenderer.swift
      - path: Snipsy/Core/ImageOptimizer.swift
      - path: Snipsy/Core/FrameGeometry.swift
      - path: Snipsy/Features/Stamp/StampView.swift
      - path: Snipsy/Features/Stamp/PerforatedRect.swift
      - path: Snipsy/Features/Stamp/PaperBackdrop.swift
      - path: Snipsy/Features/Artifact/ArtifactView.swift
      - path: Snipsy/Features/Artifact/PolaroidView.swift
      - path: Snipsy/Features/Artifact/CardView.swift
      - path: Snipsy/Shaders/Paper.metal
      - path: Snipsy/Shaders/Holo.metal
      - path: Snipsy/Shaders/Liquid.metal
    entitlements:
      path: SnipsyShare/SnipsyShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ashwinn.postmark
    info:
      path: SnipsyShare/Info.plist
      properties:
        CFBundleDisplayName: Snipsy
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Light
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinn.postmark.share
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.2"
