name: Postmark
options:
  bundleIdPrefix: com.ashwinn
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "PVQK77DQWL"
    CODE_SIGN_STYLE: "Automatic"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Postmark:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Postmark
    dependencies:
      - target: PostmarkStickers
        embed: true
      - target: PostmarkShare
        embed: true
    entitlements:
      path: Postmark/Postmark.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ashwinn.postmark
    info:
      path: Postmark/Info.plist
      properties:
        CFBundleDisplayName: Postmark
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Postmark uses the camera so you can turn what you see into collectible stamps."
        NSPhotoLibraryAddUsageDescription: "Postmark saves the stamps and stickers you export to your photo library."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinn.postmark
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "YES"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
  PostmarkStickers:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: PostmarkStickers
    entitlements:
      path: PostmarkStickers/PostmarkStickers.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ashwinn.postmark
    info:
      path: PostmarkStickers/Info.plist
      properties:
        CFBundleDisplayName: Postmark
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinn.postmark.stickers
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
  PostmarkShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PostmarkShare
      - path: Postmark/App/Theme.swift
      - path: Postmark/Core/Models.swift
      - path: Postmark/Core/StampStore.swift
      - path: Postmark/Core/VisionService.swift
      - path: Postmark/Core/StampRenderer.swift
      - path: Postmark/Core/ImageOptimizer.swift
      - path: Postmark/Core/FrameGeometry.swift
      - path: Postmark/Features/Stamp/StampView.swift
      - path: Postmark/Features/Stamp/PerforatedRect.swift
      - path: Postmark/Features/Stamp/PostmarkSeal.swift
      - path: Postmark/Features/Stamp/PaperBackdrop.swift
      - path: Postmark/Shaders/Paper.metal
      - path: Postmark/Shaders/Holo.metal
      - path: Postmark/Shaders/Liquid.metal
    entitlements:
      path: PostmarkShare/PostmarkShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ashwinn.postmark
    info:
      path: PostmarkShare/Info.plist
      properties:
        CFBundleDisplayName: Postmark
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashwinn.postmark.share
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
